{% extends "base.html" %}

{% block title %}
Add Employee - Supermarket Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Add Employee</h1>

        <p>
            Add a new employee to the supermarket system.
        </p>

    </div>

    <a href="{{ url_for('employees') }}"
       class="btn">

        ← Back to Employees

    </a>

</div>


<div class="form-container">

    <form method="POST"
          action="{{ url_for('save_employee') }}">


        <!-- ==========================================
             EMPLOYEE ID
             ========================================== -->

        <div class="form-group">

            <label for="employeeID">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeID"
                name="employeeID"
                placeholder="Example: EMP009"
                required
            >

        </div>


        <!-- ==========================================
             FIRST NAME
             ========================================== -->

        <div class="form-group">

            <label for="fName">
                First Name
            </label>

            <input
                type="text"
                id="fName"
                name="fName"
                required
            >

        </div>


        <!-- ==========================================
             LAST NAME
             ========================================== -->

        <div class="form-group">

            <label for="lName">
                Last Name
            </label>

            <input
                type="text"
                id="lName"
                name="lName"
                required
            >

        </div>


        <!-- ==========================================
             POSITION
             ========================================== -->

        <div class="form-group">

            <label for="position">
                Position
            </label>

            <select
                id="position"
                name="position"
                required
            >

                <option value="">
                    Select Position
                </option>

                <option value="Manager">
                    Manager
                </option>

                <option value="Supervisor">
                    Supervisor
                </option>

                <option value="Cashier">
                    Cashier
                </option>

                <option value="Stock Clerk">
                    Stock Clerk
                </option>

                <option value="Accountant">
                    Accountant
                </option>

            </select>

        </div>


        <!-- ==========================================
             PHONE
             ========================================== -->

        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="+233..."
                required
            >

        </div>


        <!-- ==========================================
             EMAIL
             ========================================== -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="employee@supermarket.com"
            >

        </div>


        <!-- ==========================================
             HIRE DATE
             ========================================== -->

        <div class="form-group">

            <label for="hireDate">
                Hire Date
            </label>

            <input
                type="date"
                id="hireDate"
                name="hireDate"
                required
            >

        </div>


        <!-- ==========================================
             PASSWORD
             ========================================== -->

        <div class="form-group">

            <label for="passwordHash">
                Password
            </label>

            <input
                type="password"
                id="passwordHash"
                name="passwordHash"
                required
            >

        </div>


        <!-- ==========================================
             STATUS
             ========================================== -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option value="Active">
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

            </select>

        </div>


        <!-- ==========================================
             BUTTONS
             ========================================== -->

        <div class="form-actions">

            <a href="{{ url_for('employees') }}"
               class="btn">

                Cancel

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                Add Employee

            </button>

        </div>


    </form>

</div>

{% endblock %}
