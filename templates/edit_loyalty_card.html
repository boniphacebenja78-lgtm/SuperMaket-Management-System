{% extends "base.html" %}

{% block title %}
Edit Loyalty Card — Supermarket Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Edit Loyalty Card</h1>

        <p>
            Update loyalty card information.
        </p>

    </div>

</div>


<!-- ERROR -->

{% if error %}

<div class="error">

    <strong>Error:</strong>
    {{ error }}

</div>

{% endif %}


<!-- FORM -->

<div class="form-container">

    <form
        method="POST"
        action="/loyalty-cards/update/{{ card.cardID }}"
    >


        <!-- CARD ID + CUSTOMER -->

        <div class="form-row">


            <!-- CARD ID -->

            <div class="form-group">

                <label for="cardID">
                    Card ID
                </label>

                <input
                    type="text"
                    id="cardID"
                    value="{{ card.cardID }}"
                    disabled
                >

                <small>
                    Card ID cannot be changed.
                </small>

            </div>


            <!-- CUSTOMER -->

            <div class="form-group">

                <label for="customerID">
                    Customer
                </label>

                <select
                    id="customerID"
                    name="customerID"
                    required
                >

                    {% for customer in customers %}

                    <option
                        value="{{ customer.customerID }}"
                        {% if customer.customerID == card.customerID %}
                            selected
                        {% endif %}
                    >

                        {{ customer.customerID }}
                        -
                        {{ customer.fName }}
                        {{ customer.lName }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <!-- POINTS + STATUS -->

        <div class="form-row">


            <!-- POINTS -->

            <div class="form-group">

                <label for="points">
                    Points
                </label>

                <input
                    type="number"
                    id="points"
                    name="points"
                    min="0"
                    value="{{ card.points or 0 }}"
                    required
                >

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option
                        value="Active"
                        {% if card.status == "Active" %}
                            selected
                        {% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Expired"
                        {% if card.status == "Expired" %}
                            selected
                        {% endif %}
                    >
                        Expired
                    </option>

                    <option
                        value="Suspended"
                        {% if card.status == "Suspended" %}
                            selected
                        {% endif %}
                    >
                        Suspended
                    </option>

                </select>

            </div>

        </div>


        <!-- DATES -->

        <div class="form-row">


            <!-- ISSUE DATE -->

            <div class="form-group">

                <label for="issueDate">
                    Issue Date
                </label>

                <input
                    type="date"
                    id="issueDate"
                    name="issueDate"
                    value="{{ card.issueDate }}"
                    required
                >

            </div>


            <!-- EXPIRY DATE -->

            <div class="form-group">

                <label for="expiryDate">
                    Expiry Date
                </label>

                <input
                    type="date"
                    id="expiryDate"
                    name="expiryDate"
                    value="{{ card.expiryDate }}"
                    required
                >

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <a
                href="/loyalty-cards"
                class="btn btn-secondary"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>


    </form>

</div>

{% endblock %}
