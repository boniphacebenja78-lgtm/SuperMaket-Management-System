{% extends "base.html" %}

{% block title %}
Edit Sale — Supermarket Management System
{% endblock %}

{% block content %}

<div class="sales-page">

    <!-- PAGE HEADER -->
    <div class="page-header">

        <div>

            <h1>Edit Sale</h1>

            <p>
                Update sale {{ sale.saleID }}
            </p>

        </div>

        <a
            href="/sales/view/{{ sale.saleID }}"
            class="btn btn-secondary"
        >
            Back to Sale
        </a>

    </div>


    <!-- ERROR MESSAGE -->

    {% if error %}

    <div class="error">

        <strong>Error:</strong>
        {{ error }}

    </div>

    {% endif %}


    <!-- EDIT FORM -->

    <div class="form-container">

        <form
            method="POST"
            action="/sales/update/{{ sale.saleID }}"
        >

            <!-- SALE INFORMATION -->

            <div class="form-row">

                <div class="form-group">

                    <label for="saleID">
                        Sale ID
                    </label>

                    <input
                        type="text"
                        id="saleID"
                        value="{{ sale.saleID }}"
                        disabled
                    >

                </div>


                <div class="form-group">

                    <label for="employeeID">
                        Employee
                    </label>

                    <select
                        id="employeeID"
                        name="employeeID"
                        required
                    >

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                        <option
                            value="{{ employee.employeeID }}"
                            {% if employee.employeeID == sale.employeeID %}
                                selected
                            {% endif %}
                        >

                            {{ employee.employeeID }}
                            -
                            {{ employee.fName }}
                            {{ employee.lName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <!-- CUSTOMER + PAYMENT -->

            <div class="form-row">

                <div class="form-group">

                    <label for="customerID">
                        Customer
                    </label>

                    <select
                        id="customerID"
                        name="customerID"
                    >

                        <option value="">
                            Walk-in Customer
                        </option>

                        {% for customer in customers %}

                        <option
                            value="{{ customer.customerID }}"
                            {% if customer.customerID == sale.customerID %}
                                selected
                            {% endif %}
                        >

                            {{ customer.customerID }}
                            -
                            {{ customer.fName }}
                            {{ customer.lName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                        name="paymentMethod"
                        required
                    >

                        <option
                            value="Cash"
                            {% if sale.paymentMethod == "Cash" %}
                                selected
                            {% endif %}
                        >
                            Cash
                        </option>

                        <option
                            value="Card"
                            {% if sale.paymentMethod == "Card" %}
                                selected
                            {% endif %}
                        >
                            Card
                        </option>

                        <option
                            value="Mobile Money"
                            {% if sale.paymentMethod == "Mobile Money" %}
                                selected
                            {% endif %}
                        >
                            Mobile Money
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRODUCT -->

            <div class="page-header">

                <div>

                    <h2>Product</h2>

                    <p>
                        Update the product being sold.
                    </p>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="productID">
                        Product
                    </label>

                    <select
                        id="productID"
                        name="productID"
                        required
                    >

                        <option value="">
                            Select Product
                        </option>

                        {% for product in products %}

                        <option
                            value="{{ product.productID }}"
                            {% if product.productID == item.productID %}
                                selected
                            {% endif %}
                        >

                            {{ product.productID }}
                            -
                            {{ product.productName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        value="{{ item.quantity }}"
                        required
                    >

                </div>

            </div>


            <!-- DISCOUNT + POINTS -->

            <div class="form-row">

                <div class="form-group">

                    <label for="discount">
                        Discount (%)
                    </label>

                    <input
                        type="number"
                        id="discount"
                        name="discount"
                        min="0"
                        max="100"
                        step="0.01"
                        value="{{ item.discount or 0 }}"
                    >

                </div>


                <div class="form-group">

                    <label for="pointsRedeemed">
                        Points Redeemed
                    </label>

                    <input
                        type="number"
                        id="pointsRedeemed"
                        name="pointsRedeemed"
                        min="0"
                        value="{{ sale.pointsRedeemed or 0 }}"
                    >

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="form-actions">

                <a
                    href="/sales/view/{{ sale.saleID }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Sale
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
