{% extends "base.html" %}

{% block title %}
New Sale — Supermarket Management System
{% endblock %}

{% block content %}

<div class="sales-page">

    <div class="page-header">

        <div>

            <h1>New Sale</h1>

            <p>
                Record a new supermarket sale.
            </p>

        </div>

    </div>


    {% if error %}

    <div class="error">

        <strong>Error:</strong>
        {{ error }}

    </div>

    {% endif %}


    <div class="form-container">

        <form method="POST" action="/sales/save">

            <!-- SALE INFORMATION -->

            <div class="form-row">

                <div class="form-group">

                    <label for="saleID">
                        Sale ID
                    </label>

                    <input
                        type="text"
                        id="saleID"
                        name="saleID"
                        maxlength="10"
                        placeholder="e.g. SAL031"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="employeeID">
                        Employee
                    </label>

                    <select
                        id="employeeID"
                        name="employeeID"
                        required
                    >

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                        <option value="{{ employee.employeeID }}">

                            {{ employee.employeeID }}
                            -
                            {{ employee.fName }}
                            {{ employee.lName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="customerID">
                        Customer
                    </label>

                    <select
                        id="customerID"
                        name="customerID"
                    >

                        <option value="">
                            Walk-in Customer
                        </option>

                        {% for customer in customers %}

                        <option value="{{ customer.customerID }}">

                            {{ customer.customerID }}
                            -
                            {{ customer.fName }}
                            {{ customer.lName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select
                        id="paymentMethod"
                        name="paymentMethod"
                        required
                    >

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="Mobile Money">
                            Mobile Money
                        </option>

                    </select>

                </div>

            </div>


            <!-- PRODUCT -->

            <div class="page-header">

                <div>

                    <h2>Product</h2>

                    <p>
                        Enter the product being sold.
                    </p>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="productID">
                        Product
                    </label>

                    <select
                        id="productID"
                        name="productID"
                        required
                    >

                        <option value="">
                            Select Product
                        </option>

                        {% for product in products %}

                        <option value="{{ product.productID }}">

                            {{ product.productID }}
                            -
                            {{ product.productName }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="discount">
                        Discount (%)
                    </label>

                    <input
                        type="number"
                        id="discount"
                        name="discount"
                        value="0"
                        min="0"
                        max="100"
                        step="0.01"
                    >

                </div>


                <div class="form-group">

                    <label for="pointsRedeemed">
                        Points Redeemed
                    </label>

                    <input
                        type="number"
                        id="pointsRedeemed"
                        name="pointsRedeemed"
                        value="0"
                        min="0"
                    >

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="/sales"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Sale
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
