{% extends "base.html" %}

{% block title %}
Edit Supplier - Supermarket Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Supplier</h1>
        <p>Update supplier information.</p>
    </div>

</div>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


<div class="form-container">

    <form method="POST" action="/suppliers/update/{{ supplier.supplierID }}">

        <div class="form-row">

            <div class="form-group">

                <label for="supplierID">
                    Supplier ID
                </label>

                <input
                    type="text"
                    id="supplierID"
                    name="supplierID"
                    value="{{ supplier.supplierID }}"
                    disabled
                >

                <small>
                    Supplier ID cannot be changed.
                </small>

            </div>


            <div class="form-group">

                <label for="supplierName">
                    Supplier Name
                </label>

                <input
                    type="text"
                    id="supplierName"
                    name="supplierName"
                    value="{{ supplier.supplierName }}"
                    maxlength="100"
                    required
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="phoneNo">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phoneNo"
                    name="phoneNo"
                    value="{{ supplier.phoneNo }}"
                    maxlength="20"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ supplier.email or '' }}"
                    maxlength="100"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                value="{{ supplier.address }}"
                maxlength="255"
                required
            >

        </div>


        <div class="form-group">

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                value="{{ supplier.city }}"
                maxlength="100"
                required
            >

        </div>


        <div class="form-actions">

            <a href="/suppliers" class="btn btn-secondary">
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
