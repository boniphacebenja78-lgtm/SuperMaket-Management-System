{% extends "base.html" %}

{% block title %}
Edit Category
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Category</h1>

        <p>
            Update category information.
        </p>
    </div>

    <a
        href="{{ url_for('categories') }}"
        class="btn btn-secondary"
    >
        Back to Categories
    </a>

</div>


<div class="card edit-form-card">

    <div class="card-header">

        <h2>
            Category Information
        </h2>

    </div>


    <form
        method="POST"
        action="{{ url_for(
            'update_category',
            category_id=category[0]
        ) }}"
    >

        <div class="form-grid">


            <!-- CATEGORY ID -->

            <div class="form-group">

                <label for="categoryID">
                    Category ID
                </label>

                <input
                    type="text"
                    id="categoryID"
                    value="{{ category[0] }}"
                    disabled
                >

            </div>


            <!-- CATEGORY NAME -->

            <div class="form-group">

                <label for="categoryName">
                    Category Name
                </label>

                <input
                    type="text"
                    id="categoryName"
                    name="categoryName"
                    maxlength="100"
                    value="{{ category[1] }}"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group form-group-full">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="255"
                    rows="5"
                >{{ category[2] or '' }}</textarea>

            </div>


        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('categories') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
