{% extends "base.html" %}

{% block title %}
Edit Employee
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Employee</h1>

        <p>
            Update employee information
        </p>
    </div>

    <a href="{{ url_for('employees') }}"
       class="btn btn-secondary">

        Back to Employees

    </a>

</div>


<div class="form-container">

    <form
        method="POST"
        action="{{ url_for('update_employee', employee_id=employee[0]) }}"
    >

        <!-- EMPLOYEE ID -->

        <div class="form-group">

            <label>
                Employee ID
            </label>

            <input
                type="text"
                value="{{ employee[0] }}"
                disabled
            >

            <small>
                Employee ID cannot be changed.
            </small>

        </div>


        <!-- FIRST NAME -->

        <div class="form-group">

            <label for="fName">
                First Name
            </label>

            <input
                type="text"
                id="fName"
                name="fName"
                value="{{ employee[1] }}"
                required
            >

        </div>


        <!-- LAST NAME -->

        <div class="form-group">

            <label for="lName">
                Last Name
            </label>

            <input
                type="text"
                id="lName"
                name="lName"
                value="{{ employee[2] }}"
                required
            >

        </div>


        <!-- POSITION -->

        <div class="form-group">

            <label for="position">
                Position
            </label>

            <input
                type="text"
                id="position"
                name="position"
                value="{{ employee[3] }}"
                required
            >

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                value="{{ employee[4] }}"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ employee[5] or '' }}"
            >

        </div>


        <!-- HIRE DATE -->

        <div class="form-group">

            <label for="hireDate">
                Hire Date
            </label>

            <input
                type="date"
                id="hireDate"
                name="hireDate"
                value="{{ employee[6] }}"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="passwordHash">
                Password Hash
            </label>

            <input
                type="text"
                id="passwordHash"
                name="passwordHash"
                value="{{ employee[7] }}"
                required
            >

        </div>


        <!-- STATUS -->

        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
                required
            >

                <option
                    value="Active"
                    {% if employee[8] == "Active" %}
                    selected
                    {% endif %}
                >
                    Active
                </option>

                <option
                    value="Inactive"
                    {% if employee[8] == "Inactive" %}
                    selected
                    {% endif %}
                >
                    Inactive
                </option>

            </select>

        </div>


        <!-- BUTTONS -->

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Employee
            </button>


            <a
                href="{{ url_for('employees') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
